name: Release Cascade

# After a core release, updates the yaml module to depend on it and opens a pull
# request. The tag is chosen by whoever creates the release, so it is only
# ever read from the environment, and refused unless it is a plain version: see
# .github/scripts/set-core-version.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Core release tag to cascade, such as v0.1.0. Opens a pull request, so it can be used to rehearse this workflow before a real release."
        required: true
        type: string

permissions: {}

jobs:
  cascade:
    # Only for core releases (tags like v0.1.0, not config/yaml/v0.1.0).
    # A tag that starts with v but isn't a version is refused by the first step.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The token is not left in the checkout, so the tools run below can't use it.
      # create-pull-request is given it explicitly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # A release builds from what is checked out, not from a cache that another
          # run could have written.
          cache: false

      # Records the tag, makes config/yaml require it and runs go mod tidy there (tried
      # again for a few seconds: the Go proxy learns of a tag a moment after it is pushed).
      # The tag is read from the environment and refused unless it is a plain version.
      - name: Move the yaml module to the new core
        run: bash .github/scripts/cascade-yaml.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/cascade-core-${{ env.TAG }}
          title: "chore: cascade core ${{ env.TAG }} to the yaml module"
          body: |
            Automatically generated by release-cascade workflow.

            Updates the yaml module's dependency on core to ${{ env.TAG }}.
          commit-message: "chore: cascade core ${{ env.TAG }} to the yaml module"
          delete-branch: true
