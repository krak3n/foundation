name: Release Cascade

# After a core release, updates the provider modules to depend on it and opens a pull
# request. The tag is chosen by whoever creates the release, so it is only
# ever read from the environment, and refused unless it is a plain version: see
# .github/scripts/set-core-version.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Core release tag to cascade, such as v0.1.0. Opens a pull request, so it can be used to rehearse this workflow before a real release."
        required: true
        type: string

permissions: {}

jobs:
  cascade:
    # Only for core releases (tags like v0.1.0, not config/yaml/v0.1.0).
    # A tag that starts with v but isn't a version is refused by the first step.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # The modules that require the core: the Makefile's MODULES, which a test keeps equal.
      MODULES: config/yaml config/etcd
    steps:
      # A pull request made with the workflow's own token starts no workflows, so the
      # release pull request would have no checks. The release App makes a token for this
      # repository only, with only what it needs, that is gone when the job ends. Its key is
      # a secret of the Release environment and is used nowhere else
      # (.github/scripts/check_workflows.py enforces all of it).
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: foundation
          permission-contents: write
          permission-pull-requests: write

      # The token is not left in the checkout, so the tools run below can't use it.
      # create-pull-request is given it explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          # A release builds from what is checked out, not from a cache that another
          # run could have written.
          cache: false

      # Records the tag, makes each module require it and runs go mod tidy there (tried
      # again for a few seconds: the Go proxy learns of a tag a moment after it is pushed).
      # The tag and the modules are read from the environment and refused unless plain.
      - name: Move the modules to the new core
        run: bash .github/scripts/cascade.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          # A release starts this on its tag, a detached commit, and the action does not
          # guess a base then.
          base: main
          branch: chore/cascade-core-${{ env.TAG }}
          title: "chore: cascade core ${{ env.TAG }} to the modules"
          body: |
            Automatically generated by release-cascade workflow.

            Updates the modules' dependency on core to ${{ env.TAG }}.
          commit-message: "chore: cascade core ${{ env.TAG }} to the modules"
          delete-branch: true
