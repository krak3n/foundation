name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Release
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request made with the workflow's own token starts no workflows, so the
      # release pull request would have no checks. The release App makes a token for this
      # repository only, with only what it needs, that is gone when the job ends. Its key is
      # a secret of the Release environment and is used nowhere else
      # (.github/scripts/check_workflows.py enforces all of it).
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: foundation
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: .release/config.json
          manifest-file: .release/manifest.json
